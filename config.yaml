# İçerik otomasyonu ayarları

models:
  text: gemini-3.8-flash            # senaryo yazan model
  text_fallbacks: []               # boşsa mevcut modeller API'den otomatik bulunur
  tts: gemini-3.8-flash-tts         # seslendirme modeli
  tts_fallbacks: [gemini-3.8-flash-lite-tts]

voice:
  name: Arlo                        # AI Studio'da seçtiğin ses
  fallbacks: [Orus, Charon, Algenib]  # Arlo API'de yoksa sırayla denenir
  style: ""                        # boş bırak: yeni TTS modeli talimatı metinle birlikte sesli okuyor

avatar:
  width: 420

# Kapanış çağrısı: "Yorumlara <KELİME> yaz, ..." — kelimeyi her video için senaryo modeli seçer
cta:
  default_keyword: SİSTEM
  say: "kullanılan araçların linklerini DM'den göndereyim!"
  ig_line: "💬 Yorumlara {kw} yaz, linkleri DM'den göndereyim 👇"
  scene:
    top: "Yorumlara yaz"
    word: "SİSTEM"
    line: "Linkleri DM'den atayım"
    pills: ["Claude", "ElevenLabs", "Higgsfield"]

# Instagram yorum → DM botu (her 10 dakikada bir çalışır)
dm:
  default: "Selam! 👋 Videoda bahsettiğim araçlar burada:"
  disclosure: ""            # DM'ye eklenecek not (boş = eklenmez)
  max_age_days: 7          # Instagram, yoruma DM'yi en fazla 7 gün içinde izin veriyor
  replies_ok:              # DM gittikten sonra yoruma verilecek yanıtlar (rastgele seçilir)
    - "DM'den gönderdim ✅ Gelen kutuna bak!"
    - "Gönderildi 📩 DM'ni kontrol et!"
    - "Linkleri DM'den attım ✅"
    - "Mesaj gönderildi 🚀 İstek kutusuna da bakabilirsin!"
  replies_fail:            # DM gönderilemezse
    - "DM'den ulaşamadım 🙏 Bana önce bir mesaj atarsan hemen gönderirim!"

# Affiliate linkleri: senaryo yazarı açıklamada {ANAHTAR} yer tutucusunu kullanır
affiliates:
  HIGGSFIELD:
    name: Higgsfield (AI video modelleri)
    url: https://higgsfield.ai?fpr=egemen-b32749
  ELEVENLABS:
    name: ElevenLabs (AI seslendirme)
    url: https://try.elevenlabs.io/ltkcv8jbeob1

disclosure: "#reklam · Açıklamadaki bazı linkler ortaklık (affiliate) linkidir; üzerinden abone olursan sana ek maliyet olmadan komisyon kazanabilirim."

topic_hint: "Konular ağırlıkla AI araçları/otomasyon; arada saat (horoloji) dünyasıyla AI'ı birleştiren konular da olabilir."

publish:
  services: [instagram, youtube]
  mode: shareNow                  # elle çalıştırınca hemen yayın
  timezone: Europe/Istanbul
  slots: ["09:00", "15:00"]  # zamanlanmış çalışmalarda video bu saatlere planlanır
  youtube_category: "28"          # Bilim ve Teknoloji
  # Videonun herkese açık adresi ({id} dosya adıdır). media dalı GitHub Actions tarafından güncellenir.
  media_url: "https://raw.githubusercontent.com/mendaxyazilim/icerik-otomasyonu/media/{id}.mp4"
