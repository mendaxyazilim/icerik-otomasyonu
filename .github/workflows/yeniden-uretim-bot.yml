name: Video yeniden üretim botu

# Telegram botuna gönderilen videoları Türkçe anlatım + yeniden kurgu ile yeniden üretip Buffer'dan hemen yayınlar.
# Bot her başladığında ~5,5 saat açık kalır ve mesajları anında dinler; saatlik zamanlayıcı kapanınca yenisini başlatır.
on:
  schedule:
    - cron: '23 * * * *'
  push:
    branches: [main]
    paths:
      - 'studio/remake.py'
      - '.github/workflows/yeniden-uretim-bot.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yeniden-uretim-bot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      REMAKE_PUBLISH: ${{ vars.REMAKE_PUBLISH || 'true' }}
      REMAKE_LOOP_MINUTES: '330'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Bağımlılıklar
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q -r requirements.txt
          git config --global user.name "icerik-bot"
          git config --global user.email "icerik-bot@users.noreply.github.com"
      - name: Botu çalıştır
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then echo "TELEGRAM_BOT_TOKEN secret'ı eklenmemiş, bot başlatılmadı."; exit 0; fi
          python -u -m studio.main remake-bot
