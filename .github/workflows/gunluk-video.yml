name: Günlük video

# Sistem 3 saatte bir uyanır; önümüzdeki 36 saatteki boş yayın saatleri (config.yaml → publish.slots)
# için video üretip Buffer'a o saate planlar. GitHub bir çalışmayı atlasa bile sonraki çalışma boşluğu doldurur.
on:
  schedule:
    - cron: '41 */3 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/gunluk-video.yml'
      - 'config.yaml'
  workflow_dispatch:
    inputs:
      hemen:
        description: 'Bir videoyu HEMEN yayınla (planlı saatleri beklemeden)'
        type: boolean
        default: false
      topic:
        description: 'Konu (boş bırakırsan sıradaki konu kullanılır)'
        required: false
        default: ''

permissions:
  contents: write
  issues: write

concurrency:
  group: gunluk-video
  cancel-in-progress: false

jobs:
  uret:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      HEMEN: ${{ github.event.inputs.hemen || 'false' }}
      TOPIC: ${{ github.event.inputs.topic || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Bağımlılıklar
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -r requirements.txt

      - name: Videoları üret ve Buffer'a planla
        run: |
          set -e
          git config --global user.name "icerik-bot"
          git config --global user.email "icerik-bot@users.noreply.github.com"
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          uret() {
            if [ -n "$TOPIC" ]; then python -u -m studio.main produce --out out --topic "$TOPIC"
            else python -u -m studio.main produce --out out; fi
          }

          medyaya_koy() {
            rm -rf media
            if git clone -q --depth 1 --branch media "$REMOTE" media 2>/dev/null; then :; else
              mkdir media && (cd media && git init -q -b media && git remote add origin "$REMOTE")
            fi
            cp "out/$1.mp4" "out/$1.json" media/
            (cd media
             ls *.mp4 | sort -r | tail -n +31 | while read f; do rm -f "$f" "${f%.mp4}.json"; done
             git checkout -q --orphan yeni && git add -A && git commit -q -m "media: $1" && git push -q -f origin yeni:media)
          }

          durumu_kaydet() {
            git add content/state.json
            git commit -q -m "$1" || true
            git pull -q --rebase origin main || true
            git push -q || true
          }

          for i in 1 2; do
            if [ "$HEMEN" = "true" ]; then
              SLOT=""
            else
              SLOT=$(python -m studio.main next-slot)
              if [ -z "$SLOT" ]; then echo "Önümüzdeki saatlerin hepsi dolu, yapılacak iş yok."; break; fi
              echo "== $SLOT saati için video hazırlanıyor =="
            fi

            # Gemini yoğunsa 10 dakika bekleyip bir kez daha dene
            uret || { echo "İlk deneme başarısız, 10 dk sonra tekrar"; sleep 600; uret; }
            ID=$(cat out/last_id.txt)

            medyaya_koy "$ID"
            URL=$(python -c "import yaml;print(yaml.safe_load(open('config.yaml'))['publish']['media_url'].format(id='$ID'))")
            sleep 20
            python -u -m studio.main publish --meta "out/$ID.json" --url "$URL" --due "$SLOT"

            if [ -n "$SLOT" ]; then python -m studio.main mark-slot "$SLOT"; fi
            durumu_kaydet "video hazır: $ID ${SLOT:-hemen}"
            TOPIC=""
            if [ "$HEMEN" = "true" ]; then break; fi
          done

      - name: Video dosyaları (Actions'tan indirilebilir)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video
          path: out/
          retention-days: 7
          if-no-files-found: ignore
