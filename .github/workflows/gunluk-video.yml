name: Günlük video

on:
  schedule:
    - cron: '17 13 * * *'   # her gün 16:17 (Türkiye saati)
  workflow_dispatch:
    inputs:
      topic:
        description: 'Konu (boş bırakırsan sıradaki konu kullanılır)'
        required: false
        default: ''

permissions:
  contents: write
  issues: write

concurrency:
  group: gunluk-video
  cancel-in-progress: false

jobs:
  uret:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Bağımlılıklar
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -r requirements.txt

      - name: Videoyu üret
        id: uret
        env:
          TOPIC: ${{ github.event.inputs.topic }}
        run: |
          uret() {
            if [ -n "$TOPIC" ]; then python -m studio.main produce --out out --topic "$TOPIC"
            else python -m studio.main produce --out out; fi
          }
          # Gemini yoğunsa 10 dakika bekleyip bir kez daha dene
          uret || { echo "İlk deneme başarısız, 10 dk sonra tekrar"; sleep 600; uret; }

      - name: Videoyu herkese açık media dalına koy
        env:
          ID: ${{ steps.uret.outputs.id }}
        run: |
          set -e
          git config --global user.name "icerik-bot"
          git config --global user.email "icerik-bot@users.noreply.github.com"
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git clone -q --depth 1 --branch media "$REMOTE" media 2>/dev/null; then :; else
            mkdir media && cd media && git init -q -b media && git remote add origin "$REMOTE" && cd ..
          fi
          cp "out/$ID.mp4" "out/$ID.json" media/
          cd media
          # son 14 videoyu tut, geçmişi sıfırla (depo şişmesin)
          ls -t *.mp4 | tail -n +15 | while read f; do rm -f "$f" "${f%.mp4}.json"; done
          git checkout -q --orphan yeni
          git add -A
          git commit -q -m "media: $ID"
          git push -q -f origin yeni:media

      - name: Konu sırasını kaydet
        run: |
          git add content/state.json || true
          git commit -q -m "konu ilerledi: ${{ steps.uret.outputs.id }}" || true
          git push -q || true

      - name: Onay için konu aç
        if: ${{ vars.REQUIRE_APPROVAL != 'false' }}
        env:
          ID: ${{ steps.uret.outputs.id }}
        run: |
          python - <<'EOF'
          import json, os, yaml
          i = os.environ['ID']
          m = json.load(open(f'out/{i}.json', encoding='utf-8'))
          cfg = yaml.safe_load(open('config.yaml', encoding='utf-8'))
          url = cfg['publish']['media_url'].format(id=i)
          body = f"""<!-- id: {i} -->
          ## 🎬 {m['youtube_title']}
          **Konu:** {m.get('topic','')}  ·  **Süre:** {m.get('duration','?')} sn

          ▶️ **Videoyu izle:** {url}

          ### Instagram açıklaması
          ```
          {m['instagram_text']}
          ```

          ---
          ✅ Yayınlamak için bu konuya **yayınla** yaz.  ❌ Vazgeçmek için **iptal** yaz.
          """
          open('issue.md', 'w', encoding='utf-8').write('\n'.join(l[10:] if l.startswith(' ' * 10) else l for l in body.split('\n')))
          open('title.txt', 'w', encoding='utf-8').write(f"Onay: {m['youtube_title']}")
          EOF
          gh label create onay-bekliyor --color FFA500 --force >/dev/null
          gh issue create --title "$(cat title.txt)" --body-file issue.md --label onay-bekliyor

      - name: Onaysız yayın
        if: ${{ vars.REQUIRE_APPROVAL == 'false' }}
        env:
          ID: ${{ steps.uret.outputs.id }}
        run: |
          URL=$(python -c "import yaml;print(yaml.safe_load(open('config.yaml'))['publish']['media_url'].format(id='$ID'))")
          sleep 20
          python -m studio.main publish --meta "out/$ID.json" --url "$URL"

      - name: Video dosyası (Actions'tan indirilebilir)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video
          path: out/
          retention-days: 7
