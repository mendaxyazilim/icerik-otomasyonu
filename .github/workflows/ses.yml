name: Seslendirme

# ses/*.json içindeki her satırı Gemini TTS ile ayrı ayrı seslendirir ve
# "ses-cikti" dalına <ad>/NN.wav olarak koyar. Hiçbir yere yayınlamaz.
on:
  push:
    branches: [main]
    paths: ['ses/*.json', '.github/workflows/ses.yml']
  workflow_dispatch:
    inputs:
      files:
        description: 'Seslendirilecek dosyalar (glob)'
        default: 'ses/*.json'
      model:
        description: 'TTS modeli (boşsa config)'
        default: ''

permissions:
  contents: write

jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Bağımlılıklar
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -r requirements.txt
      - name: Seslendir
        env:
          TTS_MODEL: ${{ inputs.model }}
        run: |
          set -e
          mkdir -p out
          for f in ${{ inputs.files || 'ses/*.json' }}; do
            n=$(basename "$f" .json); mkdir -p "out/$n"
            python -u - "$f" "out/$n" <<'PY'
          import sys, json, time
          from studio.main import load_cfg
          from studio.llm import tts
          cfg = load_cfg()
          import os
          if os.environ.get('TTS_MODEL'):
              cfg['models']['tts'] = os.environ['TTS_MODEL']; cfg['models']['tts_fallbacks'] = []
          lines = json.load(open(sys.argv[1], encoding='utf-8'))['lines']
          for i, t in enumerate(lines):
              for k in range(3):
                  try:
                      tts(t, cfg, f'{sys.argv[2]}/{i:02d}.wav'); print('ok', i, t); break
                  except Exception as e:
                      print('TTS hata:', e)
                      if k == 2: raise
                      time.sleep(60)
          PY
          done
      - name: Kontrol (Whisper ile yazıya dök)
        continue-on-error: true
        run: |
          pip install -q faster-whisper
          python - <<'PY'
          import glob
          from faster_whisper import WhisperModel
          m = WhisperModel('small', device='cpu', compute_type='int8')
          for f in sorted(glob.glob('out/*/*.wav')):
              segs, _ = m.transcribe(f, language='tr', word_timestamps=True)
              words = [(w.word.strip(), round(w.start, 2), round(w.end, 2)) for s in segs for w in s.words]
              print('METIN', f, ' '.join(w[0] for w in words), words)
          PY
      - name: ses-cikti dalına koy
        if: always()
        run: |
          git config --global user.name "icerik-bot"
          git config --global user.email "icerik-bot@users.noreply.github.com"
          cd out && git init -q -b ses-cikti && git add -A && git commit -q -m "seslendirme" \
            && git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ses-cikti
